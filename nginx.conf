server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao gzip para arquivos estaticos
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json text/plain;

    # Cache para assets estaticos (JS, CSS, fontes, imagens, PDF worker)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback para SPA: retorna index.html para qualquer rota nao encontrada
    location / {
        try_files $uri $uri/ /index.html;
    }
}
